plugins {
    id 'java'
}

repositories {
    maven {
        url = uri(providers.gradleProperty('v3Repository').get())
        metadataSources { sources ->
            sources.mavenPom()
        }
    }
    mavenCentral()
}

dependencies {
    implementation 'dev.hytalemodding:vecture3d-ffi:0.1.0-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('test', Test) { Test consumerTest ->
    consumerTest.useJUnitPlatform()
    consumerTest.jvmArgs '--enable-native-access=ALL-UNNAMED'
    consumerTest.systemProperty 'v3.native.library', providers.gradleProperty('v3NativeLibrary').get()
}
